name: Flashcards checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: flashcards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flashcards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          FLASHCARDS_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/flashcards_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          FLASHCARDS_TEST_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
